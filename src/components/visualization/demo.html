<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agent Graph Visualization - Demo</title>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reactflow@11/dist/style.css">
  <link rel="stylesheet" href="./AgentGraph.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen',
        'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue', sans-serif;
      background: #0a0a0a;
      color: #ffffff;
    }

    .demo-container {
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .demo-header {
      padding: 20px 40px;
      background: rgba(26, 26, 26, 0.95);
      border-bottom: 1px solid rgba(0, 229, 255, 0.2);
    }

    .demo-header h1 {
      font-size: 28px;
      color: #00E5FF;
      margin-bottom: 8px;
    }

    .demo-header p {
      color: #888888;
      font-size: 14px;
    }

    .demo-tabs {
      display: flex;
      gap: 8px;
      margin-top: 16px;
    }

    .demo-tab {
      padding: 10px 20px;
      border: none;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.05);
      color: #888888;
      cursor: pointer;
      transition: all 0.2s;
      font-size: 14px;
      font-weight: 500;
    }

    .demo-tab:hover {
      background: rgba(0, 229, 255, 0.1);
      color: #00E5FF;
    }

    .demo-tab.active {
      background: rgba(0, 229, 255, 0.2);
      color: #00E5FF;
      border: 1px solid rgba(0, 229, 255, 0.3);
    }

    .demo-content {
      flex: 1;
      position: relative;
      overflow: hidden;
    }

    .demo-info {
      position: absolute;
      top: 20px;
      right: 20px;
      background: rgba(26, 26, 26, 0.95);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(0, 229, 255, 0.2);
      border-radius: 8px;
      padding: 20px;
      max-width: 300px;
      z-index: 100;
    }

    .demo-info h3 {
      font-size: 16px;
      color: #00E5FF;
      margin-bottom: 12px;
    }

    .demo-info p {
      font-size: 13px;
      color: #aaaaaa;
      line-height: 1.6;
      margin-bottom: 12px;
    }

    .demo-info ul {
      list-style: none;
      padding: 0;
    }

    .demo-info li {
      font-size: 12px;
      color: #888888;
      margin-bottom: 6px;
      padding-left: 16px;
      position: relative;
    }

    .demo-info li:before {
      content: '→';
      position: absolute;
      left: 0;
      color: #00E5FF;
    }

    .demo-controls {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 12px;
      z-index: 100;
    }

    .demo-button {
      padding: 12px 24px;
      border: none;
      border-radius: 8px;
      background: rgba(0, 229, 255, 0.2);
      color: #00E5FF;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      backdrop-filter: blur(10px);
    }

    .demo-button:hover {
      background: rgba(0, 229, 255, 0.4);
      transform: translateY(-2px);
      box-shadow: 0 4px 20px rgba(0, 229, 255, 0.3);
    }

    .demo-button.danger {
      background: rgba(255, 68, 68, 0.2);
      color: #FF4444;
    }

    .demo-button.danger:hover {
      background: rgba(255, 68, 68, 0.4);
      box-shadow: 0 4px 20px rgba(255, 68, 68, 0.3);
    }

    .loading {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      font-size: 18px;
      color: #00E5FF;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .loading:before {
      content: '⚡';
      display: inline-block;
      margin-right: 12px;
      animation: spin 1s linear infinite;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // Demo examples data
    const demoExamples = {
      simple: {
        title: 'Simple Agent Network',
        description: 'Basic coordinator with 3 worker agents',
        nodes: [
          {
            id: '1',
            type: 'coordinator',
            position: { x: 400, y: 100 },
            data: {
              label: 'OMEGA Coordinator',
              status: 'active',
              agentCount: 3,
              taskCount: 5,
            },
          },
          {
            id: '2',
            type: 'worker',
            position: { x: 200, y: 300 },
            data: {
              label: 'Researcher',
              status: 'working',
              load: 65,
              capability: 'researcher',
            },
          },
          {
            id: '3',
            type: 'worker',
            position: { x: 400, y: 300 },
            data: {
              label: 'Coder',
              status: 'active',
              load: 45,
              capability: 'coder',
            },
          },
          {
            id: '4',
            type: 'worker',
            position: { x: 600, y: 300 },
            data: {
              label: 'Tester',
              status: 'idle',
              load: 0,
              capability: 'tester',
            },
          },
        ],
        edges: [
          { id: 'e1-2', source: '1', target: '2', animated: true },
          { id: 'e1-3', source: '1', target: '3', animated: true },
          { id: 'e1-4', source: '1', target: '4', animated: true },
        ],
        tips: [
          'Click nodes to see details',
          'Drag nodes to reposition',
          'Use mouse wheel to zoom',
          'Pulsating nodes are active',
        ],
      },
      sparc: {
        title: 'SPARC Workflow',
        description: 'Complete SPARC development pipeline',
        nodes: [
          {
            id: 'spec',
            type: 'task',
            position: { x: 100, y: 200 },
            data: {
              label: 'Specification',
              status: 'success',
              progress: 100,
              assignedTo: 'Spec Writer',
            },
          },
          {
            id: 'pseudo',
            type: 'task',
            position: { x: 300, y: 200 },
            data: {
              label: 'Pseudocode',
              status: 'success',
              progress: 100,
              assignedTo: 'Architect',
            },
          },
          {
            id: 'arch',
            type: 'task',
            position: { x: 500, y: 200 },
            data: {
              label: 'Architecture',
              status: 'working',
              progress: 75,
              assignedTo: 'System Architect',
            },
          },
          {
            id: 'refine',
            type: 'task',
            position: { x: 700, y: 200 },
            data: {
              label: 'Refinement',
              status: 'idle',
              progress: 0,
              assignedTo: 'TDD Agent',
            },
          },
          {
            id: 'complete',
            type: 'task',
            position: { x: 900, y: 200 },
            data: {
              label: 'Completion',
              status: 'idle',
              progress: 0,
              assignedTo: 'Integrator',
            },
          },
        ],
        edges: [
          { id: 'e1', source: 'spec', target: 'pseudo', animated: true },
          { id: 'e2', source: 'pseudo', target: 'arch', animated: true },
          { id: 'e3', source: 'arch', target: 'refine', animated: false },
          { id: 'e4', source: 'refine', target: 'complete', animated: false },
        ],
        tips: [
          'Green nodes are complete',
          'Blue nodes are in progress',
          'Gray nodes are pending',
          'Progress bars show completion',
        ],
      },
      fullstack: {
        title: 'Full-Stack Team',
        description: '6 specialized agents working together',
        nodes: [
          {
            id: 'coord',
            type: 'coordinator',
            position: { x: 500, y: 100 },
            data: {
              label: 'Project Coordinator',
              status: 'active',
              agentCount: 6,
              taskCount: 15,
            },
          },
          {
            id: 'backend',
            type: 'worker',
            position: { x: 200, y: 300 },
            data: {
              label: 'Backend Dev',
              status: 'working',
              load: 80,
              capability: 'backend-dev',
            },
          },
          {
            id: 'frontend',
            type: 'worker',
            position: { x: 400, y: 300 },
            data: {
              label: 'Frontend Dev',
              status: 'working',
              load: 70,
              capability: 'coder',
            },
          },
          {
            id: 'database',
            type: 'worker',
            position: { x: 600, y: 300 },
            data: {
              label: 'DB Architect',
              status: 'active',
              load: 50,
              capability: 'code-analyzer',
            },
          },
          {
            id: 'tester',
            type: 'worker',
            position: { x: 800, y: 300 },
            data: {
              label: 'QA Engineer',
              status: 'working',
              load: 60,
              capability: 'tester',
            },
          },
          {
            id: 'devops',
            type: 'worker',
            position: { x: 300, y: 500 },
            data: {
              label: 'DevOps',
              status: 'idle',
              load: 20,
              capability: 'cicd-engineer',
            },
          },
          {
            id: 'security',
            type: 'worker',
            position: { x: 700, y: 500 },
            data: {
              label: 'Security',
              status: 'active',
              load: 40,
              capability: 'reviewer',
            },
          },
        ],
        edges: [
          { id: 'e1', source: 'coord', target: 'backend', animated: true },
          { id: 'e2', source: 'coord', target: 'frontend', animated: true },
          { id: 'e3', source: 'coord', target: 'database', animated: true },
          { id: 'e4', source: 'coord', target: 'tester', animated: true },
          { id: 'e5', source: 'coord', target: 'devops', animated: false },
          { id: 'e6', source: 'coord', target: 'security', animated: true },
          { id: 'e7', source: 'backend', target: 'database', animated: true },
          { id: 'e8', source: 'frontend', target: 'backend', animated: true },
          { id: 'e9', source: 'tester', target: 'backend', animated: true },
          { id: 'e10', source: 'tester', target: 'frontend', animated: true },
        ],
        tips: [
          'Coordinator manages all agents',
          'Agents collaborate on tasks',
          'Load percentage shows workload',
          'Animated edges show active data flow',
        ],
      },
    };

    function Demo() {
      const [activeDemo, setActiveDemo] = useState('simple');
      const [isLoading, setIsLoading] = useState(true);

      useEffect(() => {
        // Simulate loading
        setTimeout(() => setIsLoading(false), 500);
      }, [activeDemo]);

      const currentDemo = demoExamples[activeDemo];

      return (
        <div className="demo-container">
          <header className="demo-header">
            <h1>🚀 Agent Graph Visualization Demo</h1>
            <p>Interactive examples of AI agent swarm visualization</p>

            <div className="demo-tabs">
              {Object.keys(demoExamples).map((key) => (
                <button
                  key={key}
                  className={`demo-tab ${activeDemo === key ? 'active' : ''}`}
                  onClick={() => {
                    setIsLoading(true);
                    setActiveDemo(key);
                  }}
                >
                  {demoExamples[key].title}
                </button>
              ))}
            </div>
          </header>

          <div className="demo-content">
            {isLoading ? (
              <div className="loading">Loading demo...</div>
            ) : (
              <>
                <div className="demo-info">
                  <h3>{currentDemo.title}</h3>
                  <p>{currentDemo.description}</p>
                  <ul>
                    {currentDemo.tips.map((tip, i) => (
                      <li key={i}>{tip}</li>
                    ))}
                  </ul>
                </div>

                <div style={{ height: '100%', background: '#0a0a0a' }}>
                  <div style={{
                    width: '100%',
                    height: '100%',
                    display: 'flex',
                    alignItems: 'center',
                    justifyContent: 'center',
                    color: '#00E5FF',
                    fontSize: '18px'
                  }}>
                    ⚡ React Flow Component Would Render Here
                    <br />
                    <small style={{ color: '#888', marginTop: '12px' }}>
                      (Requires React Flow library to be properly loaded)
                    </small>
                  </div>
                </div>

                <div className="demo-controls">
                  <button className="demo-button" onClick={() => alert('Add node functionality')}>
                    ➕ Add Node
                  </button>
                  <button className="demo-button" onClick={() => alert('Reset layout')}>
                    🔄 Reset Layout
                  </button>
                  <button className="demo-button danger" onClick={() => alert('Clear all')}>
                    🗑️ Clear All
                  </button>
                </div>
              </>
            )}
          </div>
        </div>
      );
    }

    ReactDOM.render(<Demo />, document.getElementById('root'));
  </script>
</body>
</html>
