<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Простой Тест AI Ассистента</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: linear-gradient(135deg, #0a0118 0%, #1a0033 100%);
            color: white;
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .test-container {
            text-align: center;
            max-width: 600px;
        }

        h1 {
            color: #00E5FF;
            font-size: 2.5em;
            margin-bottom: 30px;
        }

        .big-arrow {
            font-size: 5em;
            color: #FFD700;
            animation: bounce 1s infinite;
            margin: 30px 0;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0) rotate(45deg); }
            50% { transform: translateY(-20px) rotate(45deg); }
        }

        .instruction {
            background: rgba(147, 51, 234, 0.3);
            padding: 30px;
            border-radius: 20px;
            font-size: 1.5em;
            margin: 20px 0;
            border: 3px solid #9333ea;
        }

        /* ПРОСТАЯ КНОПКА AI АССИСТЕНТА */
        #ai-button {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 70px;
            height: 70px;
            background: linear-gradient(135deg, #9333ea, #7c3aed);
            border-radius: 50%;
            border: none;
            cursor: pointer;
            font-size: 35px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 32px rgba(147, 51, 234, 0.6);
            z-index: 999999;
            transition: all 0.3s;
            animation: pulse 2s infinite;
        }

        #ai-button:hover {
            transform: scale(1.1);
            box-shadow: 0 12px 40px rgba(147, 51, 234, 0.8);
        }

        @keyframes pulse {
            0%, 100% { box-shadow: 0 8px 32px rgba(147, 51, 234, 0.6); }
            50% { box-shadow: 0 8px 40px rgba(147, 51, 234, 1); }
        }

        /* ОКНО ЧАТА */
        #chat-window {
            position: fixed;
            bottom: 120px;
            right: 30px;
            width: 400px;
            height: 600px;
            background: linear-gradient(135deg, rgba(147, 51, 234, 0.95), rgba(59, 130, 246, 0.95));
            backdrop-filter: blur(20px);
            border-radius: 20px;
            border: 2px solid rgba(255, 215, 0, 0.3);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            z-index: 999998;
            display: none;
            flex-direction: column;
        }

        #chat-window.open {
            display: flex;
            animation: slideUp 0.3s ease;
        }

        @keyframes slideUp {
            from { transform: translateY(100px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .chat-header {
            padding: 20px;
            border-bottom: 2px solid rgba(255, 215, 0, 0.3);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .chat-header h3 {
            color: white;
            font-size: 1.3em;
        }

        .close-btn {
            background: none;
            border: none;
            color: white;
            font-size: 30px;
            cursor: pointer;
            opacity: 0.7;
            transition: opacity 0.3s;
        }

        .close-btn:hover {
            opacity: 1;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
        }

        .message {
            margin: 15px 0;
            padding: 15px;
            border-radius: 15px;
            max-width: 80%;
            word-wrap: break-word;
        }

        .message.ai {
            background: rgba(147, 51, 234, 0.5);
            margin-right: auto;
            border-bottom-left-radius: 5px;
        }

        .message.user {
            background: rgba(0, 229, 255, 0.5);
            margin-left: auto;
            border-bottom-right-radius: 5px;
        }

        .chat-input-container {
            padding: 20px;
            border-top: 2px solid rgba(255, 215, 0, 0.3);
            display: flex;
            gap: 10px;
        }

        .chat-input {
            flex: 1;
            padding: 15px;
            border-radius: 25px;
            border: 2px solid rgba(255, 215, 0, 0.3);
            background: rgba(0, 0, 0, 0.3);
            color: white;
            font-size: 16px;
            outline: none;
        }

        .send-btn {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: none;
            background: linear-gradient(135deg, #00E5FF, #0077FF);
            color: white;
            font-size: 20px;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .send-btn:hover {
            transform: scale(1.1);
        }

        @media (max-width: 768px) {
            #chat-window {
                width: calc(100vw - 40px);
                height: calc(100vh - 140px);
                right: 20px;
                bottom: 100px;
            }
        }
    </style>
</head>
<body>
    <div class="test-container">
        <h1>🤖 Тест AI Ассистента</h1>

        <div class="instruction">
            СМОТРИТЕ В ПРАВЫЙ НИЖНИЙ УГОЛ! ↘️
        </div>

        <div class="big-arrow">↘</div>

        <div class="instruction">
            Там ФИОЛЕТОВАЯ КНОПКА С РОБОТОМ! 🤖
        </div>
    </div>

    <!-- КНОПКА AI АССИСТЕНТА -->
    <button id="ai-button">🤖</button>

    <!-- ОКНО ЧАТА -->
    <div id="chat-window">
        <div class="chat-header">
            <h3>🤖 HypeAI Assistant</h3>
            <button class="close-btn" id="close-btn">×</button>
        </div>
        <div class="chat-messages" id="messages">
            <div class="message ai">
                👋 Привет! Я AI ассистент HypeAI. Спрашивайте обо всём!
            </div>
        </div>
        <div class="chat-input-container">
            <input type="text" class="chat-input" id="chat-input" placeholder="Напишите сообщение...">
            <button class="send-btn" id="send-btn">➤</button>
        </div>
    </div>

    <script>
        // ПРОСТОЙ СКРИПТ
        const aiButton = document.getElementById('ai-button');
        const chatWindow = document.getElementById('chat-window');
        const closeBtn = document.getElementById('close-btn');
        const chatInput = document.getElementById('chat-input');
        const sendBtn = document.getElementById('send-btn');
        const messagesDiv = document.getElementById('messages');

        console.log('🤖 AI Assistant loaded!');

        // Открыть чат
        aiButton.addEventListener('click', () => {
            console.log('Button clicked!');
            chatWindow.classList.add('open');
            chatInput.focus();
        });

        // Закрыть чат
        closeBtn.addEventListener('click', () => {
            chatWindow.classList.remove('open');
        });

        // Отправить сообщение
        function sendMessage() {
            const message = chatInput.value.trim();
            if (!message) return;

            // Добавить сообщение пользователя
            const userMsg = document.createElement('div');
            userMsg.className = 'message user';
            userMsg.textContent = message;
            messagesDiv.appendChild(userMsg);

            chatInput.value = '';

            // Ответ AI
            setTimeout(() => {
                const aiMsg = document.createElement('div');
                aiMsg.className = 'message ai';

                const lowerMsg = message.toLowerCase();

                if (lowerMsg.includes('токен') || lowerMsg.includes('token') || lowerMsg.includes('supply')) {
                    aiMsg.textContent = '💎 Всего 1 миллиард HYPEAI токенов с агрессивными ежеквартальными сжиганиями!';
                } else if (lowerMsg.includes('апы') || lowerMsg.includes('apy') || lowerMsg.includes('стейк')) {
                    aiMsg.textContent = '🔥 Стейкинг APY: 62%! Это один из самых высоких показателей в индустрии!';
                } else if (lowerMsg.includes('сервис') || lowerMsg.includes('service')) {
                    aiMsg.textContent = '🛠️ Мы предлагаем 35+ профессиональных услуг: веб-разработка, аудиты смарт-контрактов, консалтинг и многое другое!';
                } else if (lowerMsg.includes('roadmap') || lowerMsg.includes('план')) {
                    aiMsg.textContent = '📅 Roadmap 2025-2027: Q1 - Private Sale, Q2 - TGE, Q3 - CEX листинг, Q4 - Global expansion!';
                } else if (lowerMsg.includes('что') || lowerMsg.includes('what')) {
                    aiMsg.textContent = '🚀 HypeAI - это супер продвинутое агентство с 27 AI-агентами, предлагающее 35+ профессиональных услуг 24/7!';
                } else {
                    aiMsg.textContent = '🤔 Интересный вопрос! Спросите про: токеномику, сервисы, стейкинг, roadmap или команду!';
                }

                messagesDiv.appendChild(aiMsg);
                messagesDiv.scrollTop = messagesDiv.scrollHeight;
            }, 500);
        }

        sendBtn.addEventListener('click', sendMessage);
        chatInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });

        // Подтверждение загрузки
        setTimeout(() => {
            console.log('✅ AI Button should be visible now!');
            aiButton.style.display = 'flex';
        }, 100);
    </script>
</body>
</html>
