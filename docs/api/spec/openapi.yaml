openapi: 3.0.3
info:
  title: HypeAI API
  version: 1.0.0
  description: |
    Premium API for HypeAI - Infinite Intelligence Platform

    ## Features
    - 🚀 Real-time WebSocket updates
    - 🔐 JWT authentication
    - 📊 Analytics and metrics
    - 💳 Stripe payment integration
    - 🎯 AI-powered insights

    ## Authentication
    All API requests require authentication using JWT tokens.
    Include the token in the `Authorization` header:
    ```
    Authorization: Bearer <your_token>
    ```

  contact:
    name: HypeAI Support
    email: support@hypeai.io
    url: https://hypeai.io/support
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: https://api.hypeai.io/v1
    description: Production server
  - url: https://staging-api.hypeai.io/v1
    description: Staging server
  - url: http://localhost:3000/v1
    description: Local development

tags:
  - name: Authentication
    description: User authentication and session management
  - name: Users
    description: User profile and settings
  - name: Tokens
    description: Token presale and management
  - name: Analytics
    description: Real-time analytics and metrics
  - name: WebSocket
    description: WebSocket real-time updates
  - name: Payments
    description: Stripe payment processing

paths:
  /auth/register:
    post:
      tags: [Authentication]
      summary: Register new user
      description: Create a new user account with email and password
      operationId: registerUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, username]
              properties:
                email:
                  type: string
                  format: email
                  example: user@example.com
                password:
                  type: string
                  format: password
                  minLength: 8
                  example: SecurePass123!
                username:
                  type: string
                  minLength: 3
                  maxLength: 30
                  example: johndoe
                referralCode:
                  type: string
                  example: REF123ABC
      responses:
        '201':
          description: User created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'

  /auth/login:
    post:
      tags: [Authentication]
      summary: User login
      description: Authenticate user and receive JWT token
      operationId: loginUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                  example: user@example.com
                password:
                  type: string
                  format: password
                  example: SecurePass123!
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
              example:
                success: true
                token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                user:
                  id: user_123
                  email: user@example.com
                  username: johndoe
                  createdAt: 2025-01-15T10:30:00Z
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'

  /auth/refresh:
    post:
      tags: [Authentication]
      summary: Refresh JWT token
      description: Get a new access token using refresh token
      operationId: refreshToken
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Token refreshed
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                  expiresIn:
                    type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'

  /users/me:
    get:
      tags: [Users]
      summary: Get current user profile
      description: Retrieve authenticated user's profile information
      operationId: getCurrentUser
      security:
        - bearerAuth: []
      responses:
        '200':
          description: User profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
    patch:
      tags: [Users]
      summary: Update user profile
      description: Update current user's profile information
      operationId: updateCurrentUser
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                  minLength: 3
                  maxLength: 30
                bio:
                  type: string
                  maxLength: 500
                avatar:
                  type: string
                  format: uri
      responses:
        '200':
          description: Profile updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /tokens/presale:
    get:
      tags: [Tokens]
      summary: Get presale information
      description: Retrieve current presale round details and statistics
      operationId: getPresaleInfo
      responses:
        '200':
          description: Presale information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PresaleInfo'
              example:
                currentRound: 1
                totalRounds: 5
                tokenPrice: 0.0001
                tokensAvailable: 5000000
                tokensSold: 2500000
                raisedAmount: 250000
                startDate: 2025-01-15T00:00:00Z
                endDate: 2025-02-15T00:00:00Z

  /tokens/purchase:
    post:
      tags: [Tokens]
      summary: Purchase tokens
      description: Buy tokens in the current presale round
      operationId: purchaseTokens
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount, paymentMethod]
              properties:
                amount:
                  type: number
                  minimum: 0.01
                  example: 1000
                  description: Amount in USD
                paymentMethod:
                  type: string
                  enum: [bnb, usdt, card]
                  example: bnb
                referralCode:
                  type: string
                  example: REF123ABC
      responses:
        '200':
          description: Purchase initiated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          description: Payment required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /analytics/dashboard:
    get:
      tags: [Analytics]
      summary: Get dashboard analytics
      description: Retrieve comprehensive dashboard metrics and statistics
      operationId: getDashboardAnalytics
      security:
        - bearerAuth: []
      parameters:
        - name: period
          in: query
          schema:
            type: string
            enum: [24h, 7d, 30d, 90d]
            default: 7d
      responses:
        '200':
          description: Analytics data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Analytics'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /analytics/transactions:
    get:
      tags: [Analytics]
      summary: Get transaction history
      description: Retrieve user's transaction history with pagination
      operationId: getTransactions
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, completed, failed]
      responses:
        '200':
          description: Transaction list
          content:
            application/json:
              schema:
                type: object
                properties:
                  transactions:
                    type: array
                    items:
                      $ref: '#/components/schemas/Transaction'
                  pagination:
                    $ref: '#/components/schemas/Pagination'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /payments/stripe/checkout:
    post:
      tags: [Payments]
      summary: Create Stripe checkout session
      description: Initialize Stripe checkout for token purchase
      operationId: createCheckoutSession
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount]
              properties:
                amount:
                  type: number
                  minimum: 10
                  example: 1000
                successUrl:
                  type: string
                  format: uri
                  example: https://hypeai.io/success
                cancelUrl:
                  type: string
                  format: uri
                  example: https://hypeai.io/cancel
      responses:
        '200':
          description: Checkout session created
          content:
            application/json:
              schema:
                type: object
                properties:
                  sessionId:
                    type: string
                  url:
                    type: string
                    format: uri
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token obtained from login/register endpoints

  schemas:
    User:
      type: object
      properties:
        id:
          type: string
          example: user_123
        email:
          type: string
          format: email
          example: user@example.com
        username:
          type: string
          example: johndoe
        bio:
          type: string
          example: Crypto enthusiast
        avatar:
          type: string
          format: uri
          example: https://cdn.hypeai.io/avatars/user_123.jpg
        balance:
          type: number
          example: 15000
        referralCode:
          type: string
          example: REF123ABC
        createdAt:
          type: string
          format: date-time
          example: 2025-01-15T10:30:00Z
        updatedAt:
          type: string
          format: date-time
          example: 2025-01-20T15:45:00Z

    AuthResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        token:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        refreshToken:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        expiresIn:
          type: integer
          example: 3600
          description: Token expiration in seconds
        user:
          $ref: '#/components/schemas/User'

    PresaleInfo:
      type: object
      properties:
        currentRound:
          type: integer
          example: 1
        totalRounds:
          type: integer
          example: 5
        tokenPrice:
          type: number
          example: 0.0001
        tokensAvailable:
          type: number
          example: 5000000
        tokensSold:
          type: number
          example: 2500000
        raisedAmount:
          type: number
          example: 250000
        startDate:
          type: string
          format: date-time
        endDate:
          type: string
          format: date-time
        bonus:
          type: number
          example: 20
          description: Bonus percentage for current round

    PurchaseResponse:
      type: object
      properties:
        success:
          type: boolean
        transactionId:
          type: string
        amount:
          type: number
        tokens:
          type: number
        paymentAddress:
          type: string
          description: Blockchain address for payment (if applicable)
        expiresAt:
          type: string
          format: date-time

    Analytics:
      type: object
      properties:
        totalInvestors:
          type: integer
        totalRaised:
          type: number
        tokensSold:
          type: number
        averagePurchase:
          type: number
        topCountries:
          type: array
          items:
            type: object
            properties:
              country:
                type: string
              percentage:
                type: number
        chartData:
          type: array
          items:
            type: object
            properties:
              date:
                type: string
                format: date
              volume:
                type: number

    Transaction:
      type: object
      properties:
        id:
          type: string
        userId:
          type: string
        type:
          type: string
          enum: [purchase, referral, bonus]
        amount:
          type: number
        tokens:
          type: number
        status:
          type: string
          enum: [pending, completed, failed]
        paymentMethod:
          type: string
        txHash:
          type: string
          description: Blockchain transaction hash
        createdAt:
          type: string
          format: date-time

    Pagination:
      type: object
      properties:
        page:
          type: integer
        limit:
          type: integer
        total:
          type: integer
        totalPages:
          type: integer
        hasMore:
          type: boolean

    Error:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: object
          properties:
            code:
              type: string
              example: INVALID_INPUT
            message:
              type: string
              example: Invalid email address
            details:
              type: object

    WebSocketMessage:
      type: object
      properties:
        type:
          type: string
          enum: [presale_update, transaction_complete, price_update]
        data:
          type: object
        timestamp:
          type: string
          format: date-time

  responses:
    BadRequest:
      description: Bad request - invalid input
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            success: false
            error:
              code: VALIDATION_ERROR
              message: Invalid request parameters

    Unauthorized:
      description: Unauthorized - invalid or missing token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            success: false
            error:
              code: UNAUTHORIZED
              message: Invalid or expired token

    Conflict:
      description: Conflict - resource already exists
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            success: false
            error:
              code: CONFLICT
              message: Email already registered

    RateLimitExceeded:
      description: Rate limit exceeded
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            success: false
            error:
              code: RATE_LIMIT_EXCEEDED
              message: Too many requests, please try again later

  examples:
    LoginRequest:
      value:
        email: user@example.com
        password: SecurePass123!

    PurchaseRequest:
      value:
        amount: 1000
        paymentMethod: bnb
        referralCode: REF123ABC

# WebSocket API Documentation
# Connect to: wss://api.hypeai.io/v1/ws
#
# Authentication:
# Send authentication message after connection:
# {
#   "type": "auth",
#   "token": "your_jwt_token"
# }
#
# Subscribe to events:
# {
#   "type": "subscribe",
#   "channels": ["presale_updates", "transactions"]
# }
#
# Receive real-time updates:
# {
#   "type": "presale_update",
#   "data": {
#     "tokensSold": 2500000,
#     "raisedAmount": 250000
#   },
#   "timestamp": "2025-01-15T10:30:00Z"
# }
