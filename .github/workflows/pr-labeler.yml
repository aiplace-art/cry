name: PR Labeler

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  label-pr:
    name: Auto-label PR
    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Auto-label based on files
        uses: actions/labeler@v5
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          configuration-path: .github/labeler.yml

      - name: Label based on PR title
        uses: actions/github-script@v7
        with:
          script: |
            const title = context.payload.pull_request.title.toLowerCase();
            const labels = [];

            // Type labels
            if (title.includes('feat:') || title.includes('feature:')) labels.push('feature');
            if (title.includes('fix:') || title.includes('bugfix:')) labels.push('bugfix');
            if (title.includes('hotfix:')) labels.push('hotfix');
            if (title.includes('docs:')) labels.push('documentation');
            if (title.includes('refactor:')) labels.push('refactor');
            if (title.includes('test:')) labels.push('test');
            if (title.includes('chore:')) labels.push('chore');
            if (title.includes('perf:')) labels.push('performance');

            // Priority labels
            if (title.includes('[urgent]') || title.includes('[critical]')) labels.push('priority: high');

            // Size labels
            const { data: files } = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number
            });

            const additions = files.reduce((sum, file) => sum + file.additions, 0);

            if (additions < 10) labels.push('size: XS');
            else if (additions < 100) labels.push('size: S');
            else if (additions < 500) labels.push('size: M');
            else if (additions < 1000) labels.push('size: L');
            else labels.push('size: XL');

            if (labels.length > 0) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                labels: labels
              });
            }

      - name: Add area labels
        uses: actions/github-script@v7
        with:
          script: |
            const { data: files } = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number
            });

            const labels = new Set();

            files.forEach(file => {
              const path = file.filename;

              if (path.includes('.github/workflows')) labels.add('area: ci/cd');
              if (path.includes('src/contracts')) labels.add('area: smart-contracts');
              if (path.includes('src/frontend')) labels.add('area: frontend');
              if (path.includes('tests/')) labels.add('area: testing');
              if (path.includes('docs/')) labels.add('area: documentation');
              if (path.includes('scripts/')) labels.add('area: scripts');
              if (path.endsWith('.sol')) labels.add('language: solidity');
              if (path.endsWith('.ts') || path.endsWith('.tsx')) labels.add('language: typescript');
              if (path.endsWith('.js') || path.endsWith('.jsx')) labels.add('language: javascript');
            });

            if (labels.size > 0) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                labels: Array.from(labels)
              });
            }
