<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HypeAI API - Interactive Documentation</title>
    <link rel="icon" type="image/svg+xml" href="../../../website/logo-icon-only.svg">
    <link rel="stylesheet" type="text/css" href="https://unpkg.com/swagger-ui-dist@5.11.0/swagger-ui.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #0a0e27 0%, #1a1f3a 100%);
            min-height: 100vh;
        }

        .header {
            background: linear-gradient(135deg, #00e5ff 0%, #0077ff 100%);
            padding: 2rem;
            text-align: center;
            box-shadow: 0 4px 20px rgba(0, 229, 255, 0.3);
        }

        .header h1 {
            color: white;
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
            font-weight: 700;
        }

        .header p {
            color: rgba(255, 255, 255, 0.9);
            font-size: 1.1rem;
        }

        .header .logo {
            width: 80px;
            height: 80px;
            margin-bottom: 1rem;
            filter: drop-shadow(0 4px 10px rgba(0, 0, 0, 0.3));
        }

        .quick-links {
            display: flex;
            gap: 1rem;
            justify-content: center;
            margin-top: 1.5rem;
            flex-wrap: wrap;
        }

        .quick-link {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            color: white;
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            text-decoration: none;
            transition: all 0.3s ease;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .quick-link:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(0, 229, 255, 0.3);
        }

        #swagger-ui {
            max-width: 1400px;
            margin: 2rem auto;
            padding: 0 1rem;
        }

        /* Custom Swagger UI styling */
        .swagger-ui .topbar {
            display: none;
        }

        .swagger-ui .info {
            margin: 2rem 0;
        }

        .swagger-ui .scheme-container {
            background: #1a1f3a;
            border: 1px solid #00e5ff;
            border-radius: 8px;
            padding: 1rem;
        }

        .swagger-ui .opblock-tag {
            border-bottom: 2px solid #00e5ff;
        }

        .swagger-ui .opblock {
            border: 1px solid rgba(0, 229, 255, 0.3);
            border-radius: 8px;
            margin-bottom: 1rem;
        }

        .swagger-ui .opblock.opblock-post {
            background: rgba(73, 204, 144, 0.1);
            border-color: rgba(73, 204, 144, 0.5);
        }

        .swagger-ui .opblock.opblock-get {
            background: rgba(97, 175, 254, 0.1);
            border-color: rgba(97, 175, 254, 0.5);
        }

        .swagger-ui .opblock.opblock-patch {
            background: rgba(252, 161, 48, 0.1);
            border-color: rgba(252, 161, 48, 0.5);
        }

        .swagger-ui .opblock.opblock-delete {
            background: rgba(249, 62, 62, 0.1);
            border-color: rgba(249, 62, 62, 0.5);
        }

        .swagger-ui .btn.authorize {
            background: linear-gradient(135deg, #00e5ff 0%, #0077ff 100%);
            border: none;
            color: white;
        }

        .swagger-ui .btn.execute {
            background: linear-gradient(135deg, #00e5ff 0%, #0077ff 100%);
            border: none;
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 1.8rem;
            }

            .header .logo {
                width: 60px;
                height: 60px;
            }

            .quick-links {
                flex-direction: column;
                align-items: stretch;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <img src="../../../website/logo-icon-only.svg" alt="HypeAI Logo" class="logo">
        <h1>HypeAI API Documentation</h1>
        <p>Infinite Intelligence Platform - Interactive API Reference</p>

        <div class="quick-links">
            <a href="../guides/quickstart.md" class="quick-link">📚 Quickstart Guide</a>
            <a href="../guides/authentication.md" class="quick-link">🔐 Authentication</a>
            <a href="../guides/websocket.md" class="quick-link">🌐 WebSocket</a>
            <a href="../sdk/react-hooks.md" class="quick-link">⚛️ React SDK</a>
            <a href="https://github.com/hypeai/api" class="quick-link" target="_blank">💻 GitHub</a>
        </div>
    </div>

    <div id="swagger-ui"></div>

    <script src="https://unpkg.com/swagger-ui-dist@5.11.0/swagger-ui-bundle.js"></script>
    <script src="https://unpkg.com/swagger-ui-dist@5.11.0/swagger-ui-standalone-preset.js"></script>
    <script>
        window.onload = function() {
            const ui = SwaggerUIBundle({
                url: "./openapi.yaml",
                dom_id: '#swagger-ui',
                deepLinking: true,
                presets: [
                    SwaggerUIBundle.presets.apis,
                    SwaggerUIStandalonePreset
                ],
                plugins: [
                    SwaggerUIBundle.plugins.DownloadUrl
                ],
                layout: "StandaloneLayout",
                defaultModelsExpandDepth: 1,
                defaultModelExpandDepth: 3,
                displayRequestDuration: true,
                filter: true,
                tryItOutEnabled: true,
                requestInterceptor: (request) => {
                    // Add custom headers if needed
                    request.headers['X-Custom-Header'] = 'SwaggerUI';
                    return request;
                },
                responseInterceptor: (response) => {
                    // Log responses for debugging
                    console.log('API Response:', response);
                    return response;
                }
            });

            window.ui = ui;
        }
    </script>
</body>
</html>
